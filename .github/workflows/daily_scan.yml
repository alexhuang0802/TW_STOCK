name: 台股每日篩選

on:
  schedule:
    - cron: "0 4 * * 1-5"    # 台灣時間 12:00（週一到週五）
    - cron: "0 14 * * 1-5"   # 台灣時間 22:00（週一到週五）
  workflow_dispatch:          # 手動觸發

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 還原歷史資料快取
        uses: actions/cache@v4
        with:
          path: stock_data_cache.pkl
          key: stock-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-cache-${{ runner.os }}-

      - name: 執行篩選並發送 Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python taiwan_stock_scanner.py 2>&1 | tee scan_output.txt

      - name: 上傳篩選結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: scan_output.txt

      - name: 提交篩選結果到網站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/scan-results.json
          git diff --staged --quiet || git commit -m "更新篩選結果 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
